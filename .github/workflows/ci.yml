name: Humsafar CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'humsafar/package-lock.json'

      - name: Install dependencies
        working-directory: ./humsafar
        run: npm ci

      - name: Run Vitest unit & integration test suite
        working-directory: ./humsafar
        run: npm run test

      - name: Validate Next.js Production Build
        working-directory: ./humsafar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build
